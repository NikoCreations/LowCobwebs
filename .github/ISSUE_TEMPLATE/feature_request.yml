name: Feature
description: Suggest an improvement or new feature for the LowCobwebs resource pack.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |-
        Thanks for sharing an idea for LowCobwebs! Please explain how it would improve the Minecraft resource pack.
  - type: textarea
    id: problem
    attributes:
      label: Is your suggestion related to a problem?
      description: Describe the problem or limitation this feature would address.
      placeholder: I'm often frustrated when...
    validations:
      required: false
  - type: textarea
    id: idea
    attributes:
      label: Describe the feature you'd like
      description: Explain what you would like to see added or changed.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: How would this help?
      description: Describe your Minecraft use case and how the feature would improve your experience.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered any alternative solutions or features?
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots, mockups, or any other context that helps explain your suggestion.
    validations:
      required: false
